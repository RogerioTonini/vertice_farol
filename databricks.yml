# This is a Declarative Automation Bundle definition for vertice_farol.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: vertice_farol
  uuid: 9a0fb747-6961-4fd5-a6a1-fa4a179b2ef5

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-068fb8ed-9845.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-068fb8ed-9845.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/rt.data.eng.analytics@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/rt.data.eng.analytics@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: rt.data.eng.analytics@gmail.com
        level: CAN_MANAGE
